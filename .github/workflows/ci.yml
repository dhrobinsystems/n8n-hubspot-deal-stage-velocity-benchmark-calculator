name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, build check and tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Zero npm dependencies: nothing to install.
      - name: Lint
        run: npm run lint

      - name: Fixtures are reproducible
        run: |
          npm run fixtures
          git diff --exit-code -- test/fixtures

      - name: workflow.json matches src/
        run: npm run build:check

      - name: Tests
        run: npm test

      - name: Sandbox simulation
        run: npm run simulate
